<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nivi Plastics Studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;800&display=swap">
<style>
:root{--bg:#f3f4f8;--ink:#0a0f2c;--mu:#646c88;--ln:#e6e8f0;--cr:#e61c5d;--ro:#3a68ff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.55 Manrope,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}:focus-visible{outline:3px solid var(--ro);outline-offset:2px}
.lay{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.sb{background:linear-gradient(180deg,#0a0f2c,#141b4d);color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.sb .lg{margin-bottom:14px}.sb .lg img{height:44px;margin:auto;display:block}
.sb button{border:0;background:none;color:#c4cae6;text-align:left;padding:11px 14px;border-radius:12px;font-weight:600}.sb button.on{background:#ffffff1c;color:#fff}.sb button:hover{color:#fff}
.sb small{margin-top:auto;color:#8e97c0;padding:0 10px}
.mn{padding:28px 32px;max-width:1100px}.mn h1{font-size:28px;letter-spacing:-.03em;margin:0 0 4px}.sub{color:var(--mu);margin:0 0 22px}
.pn{background:#fff;border-radius:20px;padding:20px;border:1px solid var(--ln);overflow-x:auto}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}.kp div{background:#fff;border:1px solid var(--ln);border-radius:20px;padding:18px}.kp b{font-size:28px;display:block;letter-spacing:-.03em}.kp span{color:var(--mu)}
table{border-collapse:collapse;width:100%;min-width:620px}th{text-align:left;color:var(--mu);font-weight:600;font-size:12px}th,td{padding:10px 8px;border-bottom:1px solid var(--ln);vertical-align:middle}
td img{width:48px;height:48px;object-fit:contain;background:#dfe3f6;border-radius:10px}
.btn{border:0;border-radius:99px;background:var(--cr);color:#fff;font-weight:700;padding:10px 20px}.btn.ln{background:none;border:1px solid var(--ln);color:var(--ink)}.btn.sm{padding:6px 14px;font-size:13px}.btn.rd{background:#b3261e}
input,select,textarea{width:100%;border:1px solid var(--ln);border-radius:12px;padding:9px 12px;background:#fff}
.f{display:grid;gap:12px;margin:14px 0;max-width:620px}.f label{display:grid;gap:4px;color:var(--mu);font-size:13px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.note{background:#fff4d6;color:#5a4300;border-radius:12px;padding:10px 14px;margin:0 0 14px}.mu{color:var(--mu)}.gate .mu{color:#9aa3cf}
.st{display:inline-block;border-radius:99px;padding:2px 10px;background:var(--bg);font-weight:600;font-size:12px}.st.lo{background:#fde3e1;color:#b3261e}.st.ok{background:#dff5ea;color:#0f7a52}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:99px;display:none;z-index:9}
.gate{max-width:420px;margin:12vh auto;text-align:center;background:#0d1433;color:#fff;border-radius:24px;padding:36px}.gate img{height:60px;margin:0 auto 12px}
@media(max-width:800px){.lay{grid-template-columns:1fr}.sb{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:10px}.sb .lg,.sb small{display:none}.mn{padding:18px 14px}.two{grid-template-columns:1fr}}
</style><style>:root{--bg:#060a22;--ink:#f2f4ff;--mu:#9aa3cf;--ln:#ffffff1c;color-scheme:dark}
body{background:radial-gradient(60vmax 40vmax at 8% -10%,#e61c5d33,#0000),radial-gradient(60vmax 50vmax at 100% 25%,#3a68ff33,#0000),#060a22;background-attachment:fixed}
.pn,.kp div{background:#ffffff0e;border-color:var(--ln)}input,select,textarea{background:#ffffff10;color:var(--ink)}option{background:#0d1433}
.btn{background:linear-gradient(120deg,#e61c5d,#ff4d86)}.btn.ln{background:none;color:var(--ink)}.btn.rd{background:#b3261e}td img{background:#ffffff10;mix-blend-mode:normal}
.st{background:#ffffff14}.st.lo{background:#e61c5d33;color:#ff8fb0}.st.ok{background:#1fd18a22;color:#5ee6b0}.note{background:#ffb02022;color:#ffd98a}.toast{background:#fff;color:#0c1431}
.sb{background:#0a0f2ccc;border-right:1px solid var(--ln)}.sb button.on{background:linear-gradient(120deg,#e61c5d55,#3a68ff55)}.mn h1{background:linear-gradient(100deg,#fff,#ff9db9);-webkit-background-clip:text;background-clip:text;color:transparent}
</style></head><body>

function view(){({dash:vDash,prod:vProd,ord:vOrd,set:vSet})[TAB]()}
function vDash(){const low=PROD.filter(p=>p.stock<=10),rev=ORD.reduce((a,o)=>a+o.total,0);
shell(`<h1>Overview</h1><p class="sub">How the shop is doing at a glance.</p><div class="kp"><div><span>Products</span><b>${PROD.length}</b></div><div><span>Orders</span><b>${ORD.length}</b></div><div><span>Revenue</span><b>${fmt(rev)}</b></div><div><span>Low stock</span><b>${low.length}</b></div></div>${PROD.length?"":`<div class="note">Your catalogue is empty. Open Products and load the starter catalogue.</div>`}<div class="pn"><h3 style="margin-top:0">Low stock</h3>${low.length?low.map(p=>`<p>${esc(p.name)} <b style="float:right">${p.stock} left</b></p>`).join(""):'<p class="mu">Everything is well stocked.</p>'}</div>`)}
function vProd(){shell(`<h1>Products</h1><p class="sub">Change prices, stock and descriptions. Tell Claude “sync the store” to publish your changes to the public site.</p><div style="display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap"><button class="btn" onclick="pform()">Add product</button>${PROD.length?"":`<button class="btn ln" onclick="seed()">Load starter catalogue</button>`}</div><div class="pn"><table><tr><th></th><th>Name</th><th>Price</th><th>Stock</th><th>Status</th><th></th></tr>${PROD.map(p=>`<tr><td><img src="${p.photo||IMG[p.img]||IMG.logo}" alt=""></td><td><b>${esc(p.name)}</b><div class="mu">${esc(p.cat)}</div></td><td>${fmt(p.price)}</td><td><span class="st ${p.stock<=10?"lo":"ok"}">${p.stock}</span></td><td>${p.active===false?"Hidden":"Live"}</td><td><button class="btn ln sm" onclick="pform('${p.id}')">Edit</button></td></tr>`).join("")}</table></div>`)}
let PH="";function pform(id){const p=PROD.find(x=>x.id===id)||{id:"p"+Date.now().toString(36),name:"",cat:"Lidded buckets",color:"",price:0,mrp:0,stock:0,desc:"",img:"roja3",active:true};PH=p.photo||"";
shell(`<h1>${id?"Edit product":"New product"}</h1><p class="sub">${esc(p.name||"Add the details below.")}</p><div class="pn"><div class="f"><label>Name<input id="e_name" value="${esc(p.name)}"></label><div class="two"><label>Category<input id="e_cat" list="cl" value="${esc(p.cat)}"><datalist id="cl">${[...new Set(PROD.map(x=>x.cat))].map(c=>`<option>${esc(c)}`).join("")}</datalist></label><label>Colour<input id="e_color" value="${esc(p.color)}"></label></div><div class="two"><label>Selling price (₹)<input id="e_price" type="number" value="${p.price}"></label><label>MRP (₹)<input id="e_mrp" type="number" value="${p.mrp}"></label></div><div class="two"><label>Stock<input id="e_stock" type="number" value="${p.stock}"></label><label>Photo<select id="e_img" onchange="PH='';$('e_prev').innerHTML=''">${Object.keys(IMG).filter(k=>k!=="logo").map(k=>`<option ${k===p.img?"selected":""}>${k}</option>`).join("")}</select></label></div><label>Upload your own photo<input type="file" id="e_file" accept="image/*" onchange="pick(this)"></label><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="e_bg" style="width:auto" checked> Remove white background</label><div id="e_prev">${p.photo?`<img src="${p.photo}" style="height:90px;border-radius:10px">`:""}</div><label>Description<textarea id="e_desc" rows="3">${esc(p.desc)}</textarea></label><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="e_active" style="width:auto" ${p.active===false?"":"checked"}> Show in store</label></div><button class="btn" onclick="save('${p.id}')">Save product</button> <button class="btn ln" onclick="view()">Cancel</button> ${id?`<button class="btn rd" onclick="del('${p.id}')">Delete</button>`:""}</div>`)}
function pick(inp){const f=inp.files[0];if(!f)return;const im=new Image();im.onload=()=>{const k=Math.min(1,560/Math.max(im.width,im.height)),w=Math.round(im.width*k),h=Math.round(im.height*k),c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d",{willReadFrequently:true});x.drawImage(im,0,0,w,h);
if($("e_bg").checked){const d=x.getImageData(0,0,w,h),a=d.data,seen=new Uint8Array(w*h),st=[];const push=i=>{if(!seen[i]&&a[i*4]>232&&a[i*4+1]>232&&a[i*4+2]>232){seen[i]=1;st.push(i)}};for(let i=0;i<w;i++){push(i);push((h-1)*w+i)}for(let j=0;j<h;j++){push(j*w);push(j*w+w-1)}while(st.length){const i=st.pop(),X=i%w,Y=(i/w)|0;a[i*4+3]=0;X>0&&push(i-1);X<w-1&&push(i+1);Y>0&&push(i-w);Y<h-1&&push(i+w)}x.putImageData(d,0,0)}
const u=c.toDataURL("image/webp",.8);if(u.length>230000){toast("Photo is too large. Try a smaller image.");return}PH=u;$("e_prev").innerHTML=`<img src="${u}" style="height:90px;border-radius:10px;background:#ffffff14">`;toast("Photo ready. Press Save product.")};im.src=URL.createObjectURL(f)}
async function save(id){const v=k=>$("e_"+k).value,p={id,name:v("name").trim(),cat:v("cat").trim(),color:v("color").trim(),price:+v("price"),mrp:+v("mrp"),stock:+v("stock"),desc:v("desc"),img:v("img"),photo:PH,active:$("e_active").checked};
if(!p.name||p.price<=0){toast("Add a name and a price above 0");return}
try{await DB.collection("products").doc(id).set(p);toast("Saved");const i=PROD.findIndex(x=>x.id===id);i<0?PROD.push(p):PROD[i]=p;TAB="prod";view()}catch(e){toast("Could not save. Check you are signed in as an editor.")}}
async function del(id){if(!confirm("Delete this product?"))return;try{await DB.collection("products").doc(id).delete();PROD=PROD.filter(p=>p.id!==id);toast("Deleted");view()}catch(e){toast("Could not delete")}}
async function seed(){try{for(const p of SEED)await DB.collection("products").doc(p.id).set(p);toast("Starter catalogue loaded")}catch(e){toast("Could not load catalogue")}}
function vOrd(){const S=["New","Packed","Shipped","Delivered","Cancelled"];shell(`<h1>Orders</h1><p class="sub">Customer orders and their delivery status.</p><div class="pn">${ORD.length?`<table><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th></tr>${ORD.map(o=>`<tr><td><b>${o.id}</b></td><td>${esc(o.name)}<div class="mu">${esc(o.phone)}</div></td><td>${o.items.map(i=>esc(i.name)+" × "+i.q).join("<br>")}</td><td>${fmt(o.total)}</td><td><select onchange="ost('${o.id}',this.value)">${S.map(s=>`<option ${s===o.status?"selected":""}>${s}</option>`).join("")}</select></td></tr>`).join("")}</table>`:`<p class="mu">No orders yet. Once live Razorpay checkout is connected, orders will appear here.</p>`}</div>`)}
async function ost(id,s){try{await DB.collection("orders").doc(id).update({status:s});toast("Status updated")}catch(e){toast("Could not update")}}
function vSet(){shell(`<h1>Settings</h1><p class="sub">Delivery and payment settings.</p><div class="pn"><div class="f"><div class="two"><label>Delivery fee (₹)<input id="k_ship" type="number" value="${CFG.ship}"></label><label>Free delivery above (₹)<input id="k_free" type="number" value="${CFG.free}"></label></div><label>Razorpay Key ID (public key only)<input id="k_rzp" value="${esc(CFG.rzp||"")}" placeholder="rzp_live_…"></label></div><div class="note">Never enter your Razorpay Key Secret here. It belongs only on a secure server.</div><button class="btn" onclick="cfg()">Save settings</button></div>`)}
async function cfg(){CFG={ship:+$("k_ship").value,free:+$("k_free").value,rzp:$("k_rzp").value.trim()};try{await DB.collection("config").doc("store").set(CFG);toast("Settings saved")}catch(e){toast("Could not save")}}
